spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calorie_tracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-secret-key-for-local-use-only-32b!!}
app.jwt.ttl-seconds=3600

app.off.base-url=https://search.openfoodfacts.org
app.off.user-agent=${OFF_USER_AGENT:CalorieTracker/0.1 (student project)}
app.off.page-size=20
app.off.timeout=5s
app.off.min-db-results=5
app.off.max-searches-per-minute=8